name: check

on:
  push:
  pull_request:

jobs:
  validate-sample-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl
      - run: python pipeline/validate.py sample-data
      - run: python pipeline/validate.py .
      - run: python -m unittest discover tests
      - name: Sample data must not contain real experiments
        run: |
          if grep -R --include='*.json' -L '\[DEMO\]' sample-data/claims | grep -q .; then
            echo "Every sample claim must be marked [DEMO]"; exit 1
          fi
