# Market research run: Actions tab -> market -> Run workflow.
#   step = academic  paper lane (Semantic Scholar search, add papers, relation drafts)
#   step = web       market research agent (statistics, news, competitor pages)
#   step = all       both, then component tests and the Excel export
#   step = export    only rebuild the workbook (after you approve relations or edit market/review.csv)
# Results are committed to this repository; the workbook is market/out/01_Hansle_Market_Research.xlsx
name: market

on:
  workflow_dispatch:
    inputs:
      step:
        description: academic, web, all, tests or export
        type: choice
        options: [all, academic, web, tests, export]
        default: all
      only:
        description: "Optional: MKT-01,MKT-03,competitors"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pypdf openpyxl
      - name: Run
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          ONLY="${{ inputs.only }}"
          python market/run.py "${{ inputs.step }}" --data . ${ONLY:+--only "$ONLY"}
          if [ "${{ inputs.step }}" = "academic" ] || [ "${{ inputs.step }}" = "web" ]; then
            python market/run.py tests --data .
            python market/run.py export --data .
          fi
          python pipeline/bundle.py --data .
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "research-market-dump bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "Market run (${{ inputs.step }}) $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: market-workbook
          path: market/out/
