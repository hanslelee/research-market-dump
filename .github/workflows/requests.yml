# Runs the web page's requests (관련 논문 찾기, 관련 논문 웹 검색, 논문 추가, 감사, ...) on this same repository.
# research-market-dump keeps code and data in one public repository, so nothing is checked out twice.
name: requests

on:
  push:
    paths:
      - "requests/*.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: requests
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      CHECKPOINT: "1"
      TIME_BUDGET: "1200"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pypdf openpyxl
      - name: Set up git
        run: |
          git config user.name "research-market-dump bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'bundle.json merge=keep\nembeddings/papers.json merge=keep\n' >> .git/info/attributes
          git config merge.keep.driver true
      - name: Process requests
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python pipeline/migrate.py --data .
          python pipeline/requests_run.py --data .
          python pipeline/bundle.py --data .
          python market/run.py export --data .
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "Requests $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then echo "Saved"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
      - name: Start the next run if requests are left
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q --rebase || true
          if grep -lq '"status": "pending"' requests/*.json 2>/dev/null; then
            gh workflow run requests.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}" || true
          fi
